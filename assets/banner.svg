<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <linearGradient id="glow-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .tag-text {
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 12px;
        fill: #38bdf8;
      }
      
      /* Dynamic animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes pingPacket {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(280px); opacity: 0; }
      }

      .animated-blob-1 {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: 200px 150px;
      }
      .animated-blob-2 {
        animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 250px;
      }
      .moving-flow {
        stroke-dasharray: 6 10;
        animation: dashMove 4s linear infinite;
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatRev 7s ease-in-out infinite;
      }
      .ping-dot {
        animation: pingPacket 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Cyber Grid Background -->
  <rect width="1200" height="400" fill="url(#cyber-grid)" opacity="0.8" />

  <!-- Animated Glowing Orbs / Ambient Light (Background Layer) -->
  <circle class="animated-blob-1" cx="220" cy="140" r="160" fill="#0284c7" opacity="0.25" filter="url(#glow-cyan)" />
  <circle class="animated-blob-2" cx="980" cy="220" r="180" fill="#6366f1" opacity="0.2" filter="url(#glow-cyan)" />
  <circle cx="600" cy="380" r="140" fill="#0d9488" opacity="0.15" filter="url(#glow-cyan)" />

  <!-- Dynamic Network Topology Visualization (Background / Midground Accents) -->
  <g opacity="0.45">
    <!-- Connecting network lines -->
    <path d="M 120 320 C 300 360, 420 310, 600 330 C 780 350, 920 310, 1080 340" fill="none" stroke="#38bdf8" stroke-width="2" class="moving-flow" />
    <path d="M 150 90 C 340 50, 520 100, 720 70 C 900 40, 1020 90, 1120 70" fill="none" stroke="#818cf8" stroke-width="1.5" class="moving-flow" stroke-opacity="0.6" />
    
    <!-- Packet Ping Animation -->
    <g transform="translate(150, 310)">
      <circle class="ping-dot" cx="0" cy="15" r="4" fill="#38ef7d" filter="url(#glow-soft)" />
    </g>
    <g transform="translate(620, 325)">
      <circle class="ping-dot" cx="0" cy="15" r="4" fill="#00f2fe" filter="url(#glow-soft)" />
    </g>
  </g>

  <!-- Dynamic Interactive-style Node Badges (Side Floating Accents, Behind main titles) -->
  <g class="floating-card-1" opacity="0.85">
    <g transform="translate(930, 60)">
      <rect width="210" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="28" cy="30" r="10" fill="#22c55e" opacity="0.2" />
      <circle cx="28" cy="30" r="5" fill="#22c55e" />
      <text x="50" y="27" class="pill-text" font-size="12">Prediction &amp; Rollback</text>
      <text x="50" y="44" class="tag-text" font-size="11">Tick-Accurate 60Hz</text>
    </g>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <g transform="translate(950, 140)">
      <rect width="190" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="28" cy="30" r="10" fill="#38bdf8" opacity="0.2" />
      <circle cx="28" cy="30" r="5" fill="#38bdf8" />
      <text x="50" y="27" class="pill-text" font-size="12">Reliable UDP / KCP</text>
      <text x="50" y="44" class="tag-text" font-size="11">&lt; 15ms Latency</text>
    </g>
  </g>

  <!-- Main Content Area: Foreground Header (Always completely legible and unobstructed) -->
  <g transform="translate(80, 80)">
    <!-- Top Category Tag -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#00f2fe" />
    <text x="28" y="19" class="tag-text">CURATED MULTIPLAYER NETCODE</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">
      Game Networking &amp; Player Movement
    </text>
    <text x="0" y="120" class="title-text" fill="url(#cyan-blue)">
      Engines &amp; Backend Platforms ⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text">
      Client-Side Prediction • Lag Compensation • Deterministic Rollback • Authoritative Servers
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="18" y="22" class="pill-text">🎮 Unity &amp; Unreal</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(178, 0)">
        <rect width="160" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="18" y="22" class="pill-text">⚡ Rollback Netcode</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(352, 0)">
        <rect width="175" height="34" rx="17" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" />
        <text x="18" y="22" class="pill-text">🌐 Dedicated Clusters</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(540, 0)">
        <rect width="160" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
        <text x="18" y="22" class="pill-text">🚀 SaaS &amp; FOSS</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Border Glow -->
  <line x1="0" y1="398" x2="1200" y2="398" stroke="url(#cyan-blue)" stroke-width="2" opacity="0.8" />
</svg>